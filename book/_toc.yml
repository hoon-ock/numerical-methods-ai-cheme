# Jupyter Book table of contents
# Reference: https://jupyterbook.org/en/stable/structure/toc.html
#
# Entries are extensionless, so a chapter can be promoted from a .md outline stub
# to a .ipynb notebook without editing this file.
#
# Status: Chapter 10 is written. Everything else is an outline stub -- H1 plus
# section headings, with per-section source provenance in MyST `%` comments
# (visible in the file, absent from the build).
format: jb-book
root: intro

parts:
  # Caption-less leading part: jb-book forbids a root-level `chapters` list
  # alongside `parts`, so the standalone opening chapter lives here.
  - chapters:
      - file: chapters/01-numerical-methods-in-cheme

  - caption: "Part I — Python for Chemical Engineers"
    chapters:
