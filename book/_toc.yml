      - file: chapters/10-arrays-and-vectorization
      - file: chapters/11-linear-systems
      - file: chapters/12-eigenvalues
      - file: chapters/13-roots
      - file: chapters/14-differentiation-integration
      - file: chapters/15-odes
      - file: chapters/16-statistics
      - file: chapters/17-curve-fitting
      - file: chapters/18-optimization

  - caption: "Part III — From Curve Fitting to Machine Learning"
