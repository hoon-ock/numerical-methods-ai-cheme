# Makes `cheme_numerics` importable from any notebook regardless of where the
# build runs from:  pip install -e .
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheme-numerics"
version = "0.1.0"
description = "Shared helpers for the Numerical Methods and AI Modeling for Chemical Engineers course book"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[tool.setuptools]
packages = ["cheme_numerics"]
