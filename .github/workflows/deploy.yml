# Build the book, and publish it to GitHub Pages once the repo is public.
#
# While the repo is PRIVATE, the `build` job runs as CI on every push (it is
# what catches a broken _toc.yml, a missing citation key, or a notebook that
# stops executing -- `--warningiserror` turns all of those into failures), and
# the `deploy` job skips itself. See the condition on that job below.
#
# To publish, make the repo public and enable Pages once:
#   gh api -X POST repos/hoon-ock/numerical-methods-ai-cheme/pages \
#       -f 'build_type=workflow'
# or Settings -> Pages -> Source: "GitHub Actions". No edit to this file needed.
name: deploy-book

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      # Reuse executed notebook outputs across runs so only changed chapters
      # re-execute. Matches `execute_notebooks: cache` in _config.yml.
      - name: Restore notebook execution cache
        uses: actions/cache@v4
        with:
          path: book/_build/.jupyter_cache
          key: jupyter-cache-${{ hashFiles('book/chapters/**', 'cheme_numerics/**') }}
          restore-keys: jupyter-cache-

      - name: Build the book
        run: jupyter-book build book/ --warningiserror --keep-going

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    needs: build
    # GitHub Pages is unavailable for a private repo on the free plan, so
    # deploying would fail on every push. This condition skips the job while
    # private and starts satisfying itself the moment the repo is made public.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
